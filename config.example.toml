[radio]
# Start in the FM broadcast band supported by the antenna.
center_frequency_hz = 95460000

# The curated meteor profile spans 1.024 MHz and keeps the 95.3 MHz target
# away from the RTL-SDR's center/DC artifact.
sample_rate_hz = 1024000

# A fixed gain prevents automatic-gain jumps from resembling an echo.
gain_db = 28.0

# The Nooelec TCXO is already stable; start at zero and calibrate later.
ppm = 0

# rtl_sdr device index or serial number.
device = "0"

[capture]
duration_seconds = 10.0
output_dir = "captures"
