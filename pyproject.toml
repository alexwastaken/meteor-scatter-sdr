[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meteor-scatter-sdr"
version = "0.2.0"
description = "A live RTL-SDR spectrum, waterfall, and meteor-scatter candidate recorder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Parsons" }]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
meteor-sdr = "meteor_sdr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meteor_sdr = ["web/*.html", "web/*.css", "web/*.js"]
